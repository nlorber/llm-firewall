repos:
  # ruff lint and format run from the project uv env so they match `make lint` / CI
  # exactly. A pinned hook rev drifts from uv.lock: an older ruff misses lint rules
  # and formats differently, so the hook and the CI format check fight over files.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, uv)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format, uv)
        entry: uv run ruff format
        language: system
        types: [python]

  # Run mypy in the project's uv env (not an isolated hook env) so it sees the
  # installed deps and the pyproject config — identical to `make typecheck`.
  # Passing changed filenames would override `files = ["src/"]` and pull in tests,
  # which intentionally aren't strict-typed, so filenames are not passed.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src)
        entry: uv run mypy --strict src/
        language: system
        types: [python]
        pass_filenames: false
