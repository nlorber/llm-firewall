version: 2
updates:
  # Minor and patch bumps arrive as one monthly PR, security fixes as one
  # grouped PR. Major bumps are migrations, taken by hand. An update-types
  # ignore never blocks a security update.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # transformers 5.17 requires tokenizers>=0.23.1, which the tokenizers
      # constraint in pyproject.toml rules out. Lift both together.
      - dependency-name: "transformers"
        versions: [">=5.17"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
