# mlx-lm LoRA config — distil the Claude judge into Qwen3-4B-Instruct-2507 (inherently
# non-thinking). Run via `make distill-train-4b`. Mirrors the 1.7B config; see it for notes.

model: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
train: true
fine_tune_type: lora
data: "data/distill/mlx"
seed: 42

# Training parameters
batch_size: 4
iters: 300
learning_rate: 1e-4
max_seq_length: 1024
num_layers: 8

# LoRA parameters
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 16.0

# Checkpointing / evaluation
adapter_path: "adapters/qwen3-4b"
save_every: 50
steps_per_report: 10
steps_per_eval: 50
mask_prompt: true
