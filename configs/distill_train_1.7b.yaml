# mlx-lm LoRA config — distil the Claude judge into Qwen3-1.7B (QLoRA: 4-bit base + FP adapter).
# Run via `make distill-train-1.7b` (prepares data/distill/mlx first). Loss is taken only on
# the assistant JSON verdict (mask_prompt). Read directly by `mlx_lm.lora --config`.

model: "mlx-community/Qwen3-1.7B-4bit"
train: true
fine_tune_type: lora
data: "data/distill/mlx"
seed: 42

# Training parameters
batch_size: 4
iters: 300            # ~4 epochs over 290 train / batch 4 (~72 iters/epoch)
learning_rate: 1e-4   # LoRA trains hotter than full fine-tuning's ~1e-5
max_seq_length: 1024  # system(~400) + user(~120) + completion(~90) tokens fits comfortably
num_layers: 8         # apply LoRA to the last 8 transformer blocks

# LoRA parameters
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 16.0

# Checkpointing / evaluation
adapter_path: "adapters/qwen3-1.7b"
save_every: 50
steps_per_report: 10
steps_per_eval: 50    # val-loss curve → pick the best checkpoint (manual early-stop)
mask_prompt: true
