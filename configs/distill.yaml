# Distillation corpus build configuration.
#
# Candidates are sourced (data/raw + Claude-generated borderline/coercion), classified by
# the live DeBERTa model, and only the GRAY band (clean<=threat<block) is kept and then
# teacher-labeled by Claude. Thresholds MUST match configs/orchestrator.yaml.
#
# Measured GRAY yield is low (the classifier is confident on its training distribution:
# ~1/970 raw, ~10% of generated land in GRAY), so generation over-produces heavily and the
# GRAY filter + seeded cap trim to target_gray_total before the paid teacher-labeling step.

raw_dir: "data/raw"
output_dir: "data/distill"

clean_threshold: 0.3
block_threshold: 0.8

classifier_path: "models/classifier"
classifier_max_length: 512

generation_model: "claude-haiku-4-5-20251001"
teacher_model: "claude-haiku-4-5-20251001"
teacher_temperature: 0.0

# Target ~500 GRAY: generate ~5000 prompts (~10% yield), cap to target before labeling.
target_gray_total: 500
n_generated_borderline: 3000
n_generated_coercion: 2000
generation_batch_size: 20

val_ratio: 0.15
test_ratio: 0.20  # raised from 0.15 in the benign-gray top-up: more PASS in test for CIs
seed: 42

# Benign-gray top-up (make distill-topup): benign prompts wearing attack-surface features,
# to enrich the rare GRAY-band PASS cell. Yield is ~3% (classifier routes most benign to
# CLEAN), so we over-generate to add ~110 PASS. Reuses the existing labeled 340; re-splits.
n_generated_benign_gray: 3400

# --- Eval (make distill-eval): baselines run BEFORE training on data/distill/test.jsonl ---
reports_dir: "reports"
# Base (un-fine-tuned) MLX models to prompt as baselines. Empty on CI (no MLX); the run
# on the Mac fills these in. 1.7B is hybrid -> LocalJudge sets enable_thinking=False.
baseline_local_models:
  - "mlx-community/Qwen3-1.7B-4bit"
  - "mlx-community/Qwen3-4B-Instruct-2507-4bit"
local_baseline_max_tokens: 256
# Claude Haiku 4.5 per-million-token prices — VERIFY against current Anthropic pricing.
claude_price_in_per_mtok: 1.0
claude_price_out_per_mtok: 5.0

# Fine-tuned judges (base + LoRA adapter). Eval skips any whose adapter dir is absent, so
# both can be listed before the 4B is trained.
finetuned_local_models:
  - name: "finetuned Qwen3-1.7B"
    base: "mlx-community/Qwen3-1.7B-4bit"
    adapter_path: "adapters/qwen3-1.7b"
  - name: "finetuned Qwen3-4B-Instruct-2507"
    base: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
    adapter_path: "adapters/qwen3-4b"
