line-length    = 99
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line-too-long — handled by the formatter
]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # allow bare assert in test files

[format]
quote-style  = "double"
indent-style = "space"
